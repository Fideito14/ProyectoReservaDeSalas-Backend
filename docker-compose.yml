services:
  postgres:
    image: postgres:18
    container_name: reserva-salas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reserva_salas
      POSTGRES_USER: reserva_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - reserva_salas_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserva_app -d reserva_salas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reserva_salas_data:
