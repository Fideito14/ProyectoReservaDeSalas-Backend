spring.application.name=microservicio

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/reserva_salas
spring.datasource.username=reserva_app
spring.datasource.password=reserva_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000