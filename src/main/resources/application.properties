spring.application.name=microservicio

# Conexion a PostgreSQL (Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/reserva_salas}
spring.datasource.username=${DB_USERNAME:reserva_app}
spring.datasource.password=${DB_PASSWORD:reserva_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG